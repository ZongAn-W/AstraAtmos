<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstraAtmos｜行星大气实验室</title>
    <meta name="description" content="AstraAtmos 行星大气预测实验平台：探索火星与地球大气数据，开展火星臭氧预测、时空模型训练与实验比较。" />
    <!-- 浏览器图标：AstraAtmos「大气之 A」应用图标（v 参数用于替换旧火星图标缓存） -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=atmospheric-a-1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=atmospheric-a-1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=atmospheric-a-1" />
    <!-- 字体说明：原先引用 Google Fonts，国内直连不通且会阻塞首屏渲染（页面一直转圈）。
         现改为使用 src/index.css 中已定义的系统字体兜底链：
           --font-display: 'Sora','Noto Sans SC','Segoe UI','Microsoft YaHei',sans-serif
           --font-body:    'Noto Sans SC','Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif
         如需恢复品牌字体，请自托管：下载 woff2 放到 public/fonts/ 并改用 @font-face 本地引用。 -->
  </head>
  <body>
    <script>
      if (typeof window.global === 'undefined') {
        window.global = window;
      }
      // 在 React 挂载前立即应用已保存的主题，避免深→浅闪烁
      try {
        var _s = JSON.parse(localStorage.getItem('astraatmos_settings'));
        if (_s && _s.theme) {
          document.documentElement.setAttribute('data-theme', _s.theme);
        }
      } catch(e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
